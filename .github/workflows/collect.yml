name: Daily job collection

on:
  schedule:
    # 20:30 UTC = 02:00 India Standard Time on the following calendar day.
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-job-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
      JOB_TRACKER_DB: ${{ github.workspace }}/private-data/jobs.db
    steps:
      - name: Check private-data token is configured
        shell: bash
        run: |
          if [ -z "$DATA_REPO_TOKEN" ]; then
            echo "::error::Add the DATA_REPO_TOKEN Actions secret after creating the private vaishnavi-kalmegh/job-listing-data repository."
            exit 1
          fi

      - name: Check out public code repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check out private data repository
        uses: actions/checkout@v4
        with:
          repository: vaishnavi-kalmegh/job-listing-data
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: private-data
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -q

      - name: Collect all roles and produce aggregate reports
        run: python -m collector.run

      - name: Generate private human-review sample
        run: python -m discovery.sample_role_review --output private-data/role_review.csv

      - name: Commit private database snapshot
        shell: bash
        run: |
          cp reports/daily_run_summary.json private-data/run_summary.json
          mkdir -p private-data/snapshots
          cp "$JOB_TRACKER_DB" "private-data/snapshots/jobs-$(date -u +%F).sqlite3"
          git -C private-data config user.name "github-actions[bot]"
          git -C private-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C private-data add jobs.db run_summary.json role_review.csv snapshots/
          if ! git -C private-data diff --cached --quiet; then
            git -C private-data commit -m "Daily job snapshot $(date -u +%F)"
            git -C private-data push
          else
            echo "Private data repository already up to date."
          fi

      - name: Commit aggregate-only public reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily_run_summary.json reports/daily_run_summary.md reports/feasibility.md
          if ! git diff --cached --quiet; then
            git commit -m "Update aggregate job collection report"
            git push
          else
            echo "Public aggregate reports unchanged."
          fi
